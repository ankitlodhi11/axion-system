trigger:
- main

pool:
  name: dhurander

stages:

# =========================
# BUILD & PUSH IMAGE
# =========================
- stage: Build
  displayName: Build and Push Docker Image

  jobs:
  - job: ImageBuild
    displayName: Build Docker Image

    steps:

    - task: Docker@2
      displayName: Build and Push Image
      inputs:
        containerRegistry: 'docker-rg'
        repository: 'ankitlodhi11/axion-system'
        command: 'buildAndPush'
        Dockerfile: '**/Dockerfile'


# =========================
# DEPLOY TO AKS
# =========================
- stage: Deploy
  displayName: Deploy to AKS
  dependsOn: Build
  condition: succeeded()

  jobs:
  - job: AKSDeploy
    displayName: Deploy Application to AKS

    steps:

    - task: KubernetesManifest@1
      displayName: Deploy to AKS
      inputs:
        action: 'deploy'
        connectionType: 'azureResourceManager'
        azureSubscriptionConnection: 'data'
        azureResourceGroup: 'noida-rg1'
        kubernetesCluster: 'ncraks'
        manifests: 'k8s/deployment.yaml'
        containers: 'YOUR_ACR_NAME.azurecr.io/axion-system:$(Build.BuildId)'